[project]
name = "igautomation"
version = "0.1.0"
description = "Instagram automation, exploration, and scraping framework via Chrome DevTools Protocol"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
 "websocket-client>=1.6",
 "requests>=2.28",
 "typer>=0.9",
 "rich>=13.0",
 "aiosqlite>=0.19",
 "pydantic>=2.0",
 "croniter>=1.4",
 "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "ruff>=0.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
igx = "igautomation.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/igautomation"]

[tool.ruff]
target-version = "py311"
line-length = 100
